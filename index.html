<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Spark TANK — lightweight market intelligence terminal MVP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>Spark TANK</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><span class="brand-mark">T</span><div><b>SPARK TANK</b><small>MARKETS / INTELLIGENCE</small></div></div>
  <div class="status"><i></i> DEMO FEED <span id="clock">--:--:--</span></div>
</header>
<nav class="commandbar" aria-label="Terminal navigation">
  <button class="nav-btn active" data-view="dashboard">DASH</button>
  <button class="nav-btn" data-view="markets">MARKETS</button>
  <button class="nav-btn" data-view="watchlist">WATCH</button>
  <button class="nav-btn" data-view="signals">SIGNALS</button>
  <button class="nav-btn" data-view="about">ABOUT</button>
</nav>
<main id="app"></main>
<footer><span>SPARK TANK MVP</span><span>OPEN • MODULAR • MOBILE</span><span id="network">LOCAL DEMO</span></footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
